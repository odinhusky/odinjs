<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <% if (process.env.NODE_ENV !== 'development' && !ctx.mode.cordova && process.env.VITE_APP_SITE_VERSION) { %>
    <link
      rel="preload"
      href="/environment.json?v=<%= process.env.VITE_APP_SITE_VERSION %>"
      as="fetch"
      crossorigin="anonymous"
    />
    <% } %>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 拉丁靠自託管 OpenSans-Core；Google 只補繁中 Noto Sans TC（鎖 400/700） -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap"
      />
    </noscript>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <% if (process.env.SITE_KEY === "set_r022") { %>
    <!-- set_r022：首屏 FA 已改 Iconify SVG；延後 FA CSS，避免一進站下載 fa-solid-900 ~150KB -->
    <script>
      (function () {
        var FA_HREF = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        var loaded = false
        function loadFontAwesome() {
          if (loaded) return
          loaded = true
          var link = document.createElement("link")
          link.rel = "stylesheet"
          link.href = FA_HREF
          document.head.appendChild(link)
        }
        function schedule() {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(function () {
              loadFontAwesome()
            }, { timeout: 4000 })
          } else {
            setTimeout(loadFontAwesome, 2000)
          }
        }
        if (document.readyState === "complete") schedule()
        else window.addEventListener("load", schedule)
      })()
    </script>
    <% } else { %>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      media="print"
      onload="this.media='all'"
    />
    <% } %>
    <noscript>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    </noscript>
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="description"
      content="Online gaming platform offering games, promotions, and member account services."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <!-- 先讀取不存在的icon避免瀏覽器預設讀取favicon.ico的行為 -->
    <link rel="icon" href="data:," />

    <!-- @@__HEAD_INJECT_EXTENSIONS__@@ -->
    <!-- @@__CUSTOM_HEAD_INJECT_EXTENSIONS__@@ -->
  </head>
  <body>
    <!-- quasar:entry-point -->
    <!-- @@__BODY_INJECT_EXTENSIONS__@@ -->
    <!-- @@__CUSTOM_BODY_INJECT_EXTENSIONS__@@ -->
  </body>
</html>
