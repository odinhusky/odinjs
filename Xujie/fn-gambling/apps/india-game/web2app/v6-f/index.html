    // sensorsDataInit(`${defPackageName}w2a`);

    !function (f, b, e, v, n, t, s) {
      if (f.fbq) return;
      n = f.fbq = function () {
        n.callMethod ?
          n.callMethod.apply(n, arguments) : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n;
      n.push = n;
      n.loaded = !0;
      n.version = '2.0';
      n.queue = [];
      t = b.createElement(e);
      t.async = !0;
      t.src = v;
      s = b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t, s);
    }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');


    const searchParams = new URLSearchParams(window.location.search);

    function doNoscriptSetUp(pixelId) {
      if (pixelId) {
        var noscriptImg = document.createElement('img');
        noscriptImg.width = '1';
        noscriptImg.height = '1';
        noscriptImg.style.display = 'none';
        noscriptImg.src = `https://www.facebook.com/tr?id=${pixelId}&ev=PageView&noscript=1`;

        var noscriptTag = document.createElement('noscript');
        noscriptTag.appendChild(noscriptImg);
        document.body?.appendChild(noscriptTag);
      }

      // doEventPixel('PageView');
    }

    // await async .json file， 封裝一個 async fun do init fb pixel
    function loadDataAndProcess() {
      const pixelId = searchParams.get('pixel') || '';
      fbq('init', pixelId);
      fbq('track', 'PageView');
      doNoscriptSetUp(pixelId);
    }

    // do and await
    loadDataAndProcess();

    function getCookie(name) {
      let cookie = {};
      document.cookie.split(';').forEach(function (el) {
        let split = el.split('=');
        cookie[split[0].trim()] = split.slice(1).join('=');
      });
      return cookie[name];
    }

    async function doEventPixel(eventName) {
      const appId = searchParams.get('app_id') || defChannelId
      const fbclid = searchParams.get('fbclid') || getCookie('_fbc');
      const fbpid = searchParams.get('fbpid') || getCookie('_fbp');
      const data = {
        'appId': appId,
        'eventName': eventName,
        'fbc': fbclid || '',
        'fbp': fbpid || '',
        'deviceId': fingerprint.get()
      };
      useEventPixel(data);
    }


    let isThrottled = false;

    function throttle(func, delay) {
      return function (...args) {
        if (!isThrottled) {
          func.apply(this, args);
          isThrottled = true;
          setTimeout(() => {
            isThrottled = false;
          }, delay);
        }
      };
    }

    async function openAppOrDownload() {
      const appId = searchParams.get('app_id') || defChannelId
      const fbcId = searchParams.get('fbclid') || getCookie('_fbc');
      const fbpId = searchParams.get('fbpid') || getCookie('_fbp');
      const pixelId = searchParams.get('pixel') || '';

      // Facebook 動態URL占位符
      const adId = searchParams.get('ad_id') || '';
      const adsetId = searchParams.get('adset_id') || '';
      const campaignId = searchParams.get('campaign_id') || '';
      const adName = searchParams.get('ad_name') || '';
      const adsetName = searchParams.get('adset_name') || '';
      const campaignName = searchParams.get('campaign_name') || '';
      const placement = searchParams.get('placement') || '';
      const siteSourceName = searchParams.get('site_source_name') || '';

      const params = {
        appId: appId,
        deviceId: fingerprint.get?.(),
        fbc: fbcId,
        fbp: fbpId,
        pixelId: pixelId,

        // Facebook 動態URL占位符
        adId: adId,
        adsetId: adsetId,
        campaignId: campaignId,
        adName: adName,
        adsetName: adsetName,
        campaignName: campaignName,
        placement: placement,
        siteSourceName: siteSourceName,
        postHogDistinctId: posthog?.get_distinct_id() || ''
      };

      const filteredParams = Object.fromEntries(
        Object.entries(params).map(([k, v]) => [k, v ?? ''])
      );

      const queryString = new URLSearchParams(filteredParams).toString();
      const deppLink = `${defDeepLinkSchema}://app/hall?wake_up_from=pixel&${queryString}`

      console.log('@@@===> web2app Download params', JSON.stringify(filteredParams));
      posthog?.capture('Download', {
        ...filteredParams
      })
      doEventPixel('Download');

      const loader = document.getElementById("loader");
      loader.classList.remove("hidden");

      let link = `https://dl.7ind.com/dl/rd2`
      link += '?deep_link=' + encodeURIComponent(deppLink)
      link += '&redirect=' + encodeURIComponent(`https://dl.7ind.com/dl/latest.apk?${queryString}`);
      window.location.href = link

      setTimeout(() => {
        const loader = document.getElementById("loader");
        loader.classList.add("hidden");

      }, 1000 * 10)
    }

    // 封裝取抖動行為
    const throttleHandleClick = throttle(openAppOrDownload, 500);

  </script>

<script type="text/javascript">
  const userLang = navigator.language || navigator.languages[0];

  const indianLangs = [
    'hi-IN'
    // "en-IN", "bn-IN", "ta-IN", "te-IN", "ml-IN",
    // "kn-IN", "mr-IN", "gu-IN", "ur-IN"
  ];
  const localeFlag = indianLangs.includes(userLang) ? 'hi' : 'en';

  window.onload = function () {
    const dots = document.querySelectorAll('.dot');

    var locale = localeFlag;

    const swiper = new Swiper('.swiper', {
      slidesPerView: 1,
      loop: false,
      speed: 1500,
      autoplay: {
        delay: 1000, // 设置自动播放的时间间隔
        disableOnInteraction: false
      },
      slideToClickedSlide: true,
      on: {
        slideChange: function () {
          // console.log("slideChange", this.activeIndex, );
          updateDots(this.activeIndex);
        }
      }
    });

    // 更新小圆点的状态
    function updateDots(activeIndex) {
      dots.forEach((dot, index) => {
        dot.classList.remove('active');
        if (index === activeIndex) {
          dot.classList.add('active');
        }
      });
    }

    updateDots(swiper.activeIndex);

    const content = {
      en: {
        // startText: 'Start the game',
        inviteText: 'Claim ₹500 for invites!',
        downloadText: 'Download App ＆ Play',
        imgBg1: 'https://static.ttgroup.vip/in/v6/web2app_f/bg_1_en.webp',
        imgBg2: 'https://static.ttgroup.vip/in/v6/web2app_f/bg_2_en.webp',
        imgBg3: 'https://static.ttgroup.vip/in/v6/web2app_f/bg_3_en.webp',
        langIcon: 'https://static.ttgroup.vip/in/v6/web2app_f/ic_wrapper.webp',
        langText: 'English'
      },
      hi: {
        // startText: 'अभी खेलें',
        inviteText: 'इनवाइट्स पर ₹500 पाएं!',
        downloadText: 'ऐप डाउनलोड करें और खेलें',
        imgBg1: 'https://static.ttgroup.vip/in/v6/web2app_f/bg_1_hi.webp',
        imgBg2: 'https://static.ttgroup.vip/in/v6/web2app_f/bg_2_hi.webp',
        imgBg3: 'https://static.ttgroup.vip/in/v6/web2app_f/bg_3_hi.webp',
        langIcon: 'https://static.ttgroup.vip/in/v6/web2app_f/ic_wrapper.webp',
        langText: 'हिंदी'
      }
    };


    const toggle = document.getElementById('dropdownToggle');
    const list = document.getElementById('dropdownList');
    const selectedIcon = document.getElementById('selectedIcon');
    const selectedText = document.getElementById('selectedText');

    function reload() {
      // document.querySelector('.start-text').textContent = content[locale].startText;
      document.querySelector('.invite-text').textContent = content[locale].inviteText;
      document.querySelector('.download-text').textContent = content[locale].downloadText;

      document.querySelector('.img_bg_1').src = content[locale].imgBg1;
      document.querySelector('.img_bg_2').src = content[locale].imgBg2;
      document.querySelector('.img_bg_3').src = content[locale].imgBg3;

      selectedIcon.src = content[locale].langIcon;
      selectedText.textContent = content[locale].langText;
    }

    reload();


    toggle.addEventListener('click', () => {
      list.classList.toggle('show');
    });

    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        const lang = item.getAttribute('data-lang');
        list.classList.remove('show');
        locale = lang;
        reload();
        console.log('選擇語言代碼:', lang);
      });
    });

    // 點擊其他區域關閉
    document.addEventListener('click', (e) => {
      if (!document.getElementById('langDropdown').contains(e.target)) {
        list.classList.remove('show');
      }
    });
  };
</script>
