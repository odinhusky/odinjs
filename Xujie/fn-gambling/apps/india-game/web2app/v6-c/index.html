    function doNoscriptSetUp(pixelId) {
      if (pixelId) {
        var noscriptImg = document.createElement('img');
        noscriptImg.width = '1';
        noscriptImg.height = '1';
        noscriptImg.style.display = 'none';
        noscriptImg.src = `https://www.facebook.com/tr?id=${pixelId}&ev=PageView&noscript=1`;

    function getCookie(name) {
      let cookie = {};
      document.cookie.split(';').forEach(function(el) {
        let split = el.split('=');
        cookie[split[0].trim()] = split.slice(1).join('=');
      });
      return cookie[name];
    }

      const settingData = await loadSettingByTrackToken(adjustTrackerToken, defPackageName);

      let fbAccessToken = settingData?.pixel?.accessToken || searchParams.get('fb_access_token') || '';

    }

    let isThrottled = false;

    function throttle(func, delay) {
      return function(...args) {
        if (!isThrottled) {
          func.apply(this, args);
          isThrottled = true;
          setTimeout(() => {
            isThrottled = false;
          }, delay);
        }
      };
    }

    function userDevice() {
      var userAgent = navigator.userAgent;
      if (userAgent.indexOf('iPhone') != -1 || userAgent.indexOf('iPad') != -1 || userAgent.indexOf('iPod') != -1) {
        console.log('current device is ios');

    async function handleButtonClick() {
      const settingData = await loadSettingByTrackToken(adjustTrackerToken, defPackageName);
      let fbPixelId = settingData?.pixel?.pixelId || searchParams.get('fb_pixel_id');
      let fbAccessToken = settingData?.pixel?.accessToken || searchParams.get('fb_access_token');
      let channelId = adjustTrackerToken
        ? settingData?.appId || searchParams.get('cid') || defChannelId

        ? settingData?.name || 'none'
        : 'none';
      // TODO 增加參數 [channel/source/medium]
      let medium = settingData?.medium || searchParams.get('medium') || 'paid';
      let source = settingData?.source || searchParams.get('source') || 'facebook';

      const downloadDomain = await  loadDownloadDomainBySetting(defPackageName)

      let campaignParameter = adjustTrackerToken ? `?campaign=${campaignname}%20%28${campaignid}%29` : `?campaign=ttgroup`;
      let adgroupParameter = adjustTrackerToken ? `&adgroup=${adsetname}%20%28${adsetid}%29` : `&adgroup=ttgroup`;
      let creativeParameter = adjustTrackerToken ? `&creative=${adname}%20%28${adid}%29` : `&creative=ttgroup`;
      let channelParameter = channelName ? `&channel=${channelName}` : '';
      let sourceParameter = source ? `&source=${source}` : '';
      let mediumParameter = medium ? `&medium=${medium}` : '';
      let promoteGameIdParameter = promoteGameId ? `__promoteGameId_${promoteGameId}` : '';
      let referralCodeParameter = referralCode ? `__referralCode_${referralCode}` : '';
      let labelParameter = `&label=medium_${medium}__source_${source}__channel_${channelName}` + promoteGameIdParameter + referralCodeParameter;
      let fbclidParameter = fbclid ? `&fbclid=${fbclid}` : '';
      let fbpidParameter = fbpid ? `&fbpid=${fbpid}` : '';
      let fbPixelIdParameter = fbPixelId ? `&fb_pixel_id=${fbPixelId}` : '';
      let fbAccessTokenParameter = fbAccessToken ? `&fb_access_token=${fbAccessToken}` : '';

      let deepLinkParameter = `${defDeepLinkSchema}://app/hall`;
      deepLinkParameter += campaignParameter;
      deepLinkParameter += adgroupParameter;
      deepLinkParameter += creativeParameter;
      deepLinkParameter += channelParameter;
      deepLinkParameter += sourceParameter;
      deepLinkParameter += mediumParameter;

      // let redirectParameter = `https://${downloadUrl}/apk/${defPackageName}/${defPackageName}_${channelId}.apk`;
      let redirectParameter;
      const state = userDevice();
      if (state) {
        redirectParameter = defDomain + '/hall';
      } else {
        let randomPath = generateRandomPath()
        console.log('@@@===> randomPath' , randomPath)
        redirectParameter = `https://${downloadUrl}/apk/${randomPath}/${defPackageName}/${defPackageName}_${channelId}.apk`;
      }

      let link = `https://app.adjust.com/${adjustTrackerToken ? adjustTrackerToken : defAdjustTrackerToken}`;
      link += campaignParameter;
      link += adgroupParameter;
      link += creativeParameter;
      link += channelParameter;
      link += sourceParameter;
      link += mediumParameter;
      link += labelParameter;
      link += fbclidParameter;
      link += fbpidParameter;
      link += fbPixelIdParameter;
      link += fbAccessTokenParameter;

      link += '&deep_link=' + encodeURIComponent(deepLinkParameter);
      link += '&redirect=' + encodeURIComponent(redirectParameter);
      console.log('link', link);
      // // Sensors Data Track
      // sensorsDataTrack('DownloadApk', { 'apkUrl': link, 'fbc': fbclid || '', 'fbp': fbpid || '' });
      doEventPixel('Download');
      window.location.href = link;
    };

<script type="text/javascript">
  window.onload = function () {
    const dots = document.querySelectorAll(".dot");

    const swiper = new Swiper(".swiper", {
      slidesPerView: 1,
      loop: false,
      speed: 1500,
      autoplay: {
        delay: 1000, // 设置自动播放的时间间隔
        disableOnInteraction: false,
      },
      slideToClickedSlide: true,
      on: {
        slideChange: function () {
          // console.log("slideChange", this.activeIndex, );
          updateDots(this.activeIndex);
        },
      },
    });

    // 更新小圆点的状态
    function updateDots(activeIndex) {
      dots.forEach((dot, index) => {
        dot.classList.remove("active");
        if (index === activeIndex) {
          dot.classList.add("active");
        }
      });
    }

    updateDots(swiper.activeIndex);
  };
</script>
