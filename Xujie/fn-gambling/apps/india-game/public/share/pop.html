<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>超讚產品 123</title>
  <meta property="og:title" content="超讚產品 123" />
  <meta property="og:description" content="這是一個超棒的產品，你一定會喜歡！" />
  <meta property="og:image" content="%VITE_OG_IMAGE%" />
  <meta property="og:url" content="%VITE_OG_URL%" />
  <meta property="og:type" content="%VITE_OG_TYPE%" />

  <!-- 自動跳轉到 React 真正頁面 -->
  <!-- <meta http-equiv="refresh" content="0;url=%VITE_OG_URL%/pop" /> -->
</head>

<body>
  <p>載入中...如果沒有跳轉，<a href="https://192.168.2.16:5173/pop?referral_code=123456">請點這裡</a></p>

  <script>
    // 获取 window.location.search 中的 referral_code 参数
    const urlParams = new URLSearchParams(window.location.search);
    const referralCode = urlParams.get('referral_code');
    // 将 referral_code 添加到 URL 中
    const newUrl = `${window.location.origin}/pop?referral_code=${referralCode || ''}`;
    window.location.href = newUrl;


    // test
    document.querySelector('a').innerHTML = `<a href="${newUrl}">點這裡</a>`;
    document.querySelector('a').addEventListener('click', function (event) {
      event.preventDefault(); // 阻止默认事件
      window.location.href = newUrl; // 跳转到新的URL
    });
  </script>
</body>

</html>
